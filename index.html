<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#534AB7"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="家計簿"/>
<title>家計簿</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.29.0/dist/tabler-icons.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
:root{
  --accent:#534AB7;--accent-l:#EEEDFE;
  --bg:#F6F5F2;--surface:#fff;--surface2:#F1EFE8;
  --border:rgba(0,0,0,.09);--border2:rgba(0,0,0,.18);
  --t1:#1A1A18;--t2:#5F5E5A;--t3:#888780;
  --income:#27500A;--income-bg:#EAF3DE;
  --expense:#791F1F;--expense-bg:#FCEBEB;
  --r-sm:8px;--r-md:12px;--r-lg:16px;
  --tab-h:60px;--nav-h:52px;
  --font:'Noto Sans JP',sans-serif;--mono:'DM Mono',monospace;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#111110;--surface:#1C1C1A;--surface2:#252523;
  --border:rgba(255,255,255,.09);--border2:rgba(255,255,255,.18);
  --t1:#F1EFE8;--t2:#B4B2A9;--t3:#888780;
  --accent:#AFA9EC;--accent-l:#26215C;
  --income:#C0DD97;--income-bg:#173404;
  --expense:#F09595;--expense-bg:#501313;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;width:100%;overflow:hidden}
body{font-family:var(--font);color:var(--t1);background:var(--bg);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:var(--font)}
.shell{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;background:var(--bg)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:var(--nav-h);padding-bottom:calc(var(--tab-h) + 8px)}
.nav{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:var(--nav-h);background:var(--surface);border-bottom:.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:100}
.nav-title{font-size:16px;font-weight:500}
.nav-btn{font-size:22px;color:var(--t2);display:flex;align-items:center;padding:6px}
.nav-btn-text{font-size:14px;font-weight:500;color:var(--accent)}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:var(--tab-h);background:var(--surface);border-top:.5px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--t3);padding-top:6px;cursor:pointer;transition:color .15s}
.tab.on{color:var(--accent)}
.tab i{font-size:22px}
.p{padding:12px 14px}
.card{background:var(--surface);border-radius:var(--r-md);border:.5px solid var(--border);padding:14px 16px;margin-bottom:10px}
.s-head{font-size:13px;font-weight:500;margin-bottom:10px}
.m-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.m-card{background:var(--surface2);border-radius:var(--r-sm);padding:10px 12px}
.m-lbl{font-size:11px;color:var(--t3);margin-bottom:3px}
.m-val{font-size:18px;font-weight:500}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:.5px solid var(--border)}
.row:last-child{border-bottom:none}
.rl{display:flex;align-items:center;gap:10px}
.icon{width:32px;height:32px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500}
.pill-g{background:#EAF3DE;color:#27500A}
.pill-a{background:#FAEEDA;color:#633806}
.pill-r{background:#FCEBEB;color:#791F1F}
.pill-p{background:#EEEDFE;color:#3C3489}
@media(prefers-color-scheme:dark){
  .pill-g{background:#173404;color:#C0DD97}.pill-a{background:#412402;color:#FAC775}
  .pill-r{background:#501313;color:#F7C1C1}.pill-p{background:#26215C;color:#CECBF6}
}
.predict{background:var(--accent-l);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:10px}
.predict-lbl{font-size:11px;color:var(--accent);margin-bottom:2px}
.predict-val{font-size:17px;font-weight:500}
.predict-sub{font-size:11px;color:var(--t2);margin-top:3px}
.warn{background:#FAEEDA;padding:9px 16px;display:flex;align-items:flex-start;gap:10px;border-bottom:.5px solid #EF9F27}
.warn i{font-size:18px;color:#633806;flex-shrink:0;margin-top:1px}
.warn-t{font-size:12px;color:#633806;line-height:1.5}
@media(prefers-color-scheme:dark){.warn{background:#412402;border-color:#854F0B}.warn i,.warn-t{color:#FAC775}}
.pb{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:6px}
.pf{height:100%;border-radius:3px;transition:width .5s ease}
.toggle{display:flex;background:var(--surface2);border-radius:var(--r-sm);padding:2px;margin-bottom:12px;border:.5px solid var(--border)}
.tbtn{flex:1;text-align:center;font-size:13px;padding:7px 0;border-radius:6px;color:var(--t2);cursor:pointer;transition:all .15s}
.tbtn.on{background:var(--surface);color:var(--t1);font-weight:500;border:.5px solid var(--border)}
.fi{flex:1;font-size:14px;padding:9px 12px;border-radius:var(--r-sm);border:.5px solid var(--border2);background:var(--surface2);color:var(--t1);outline:none;width:100%}
.fi:focus{border-color:var(--accent)}
.fr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fl{font-size:13px;color:var(--t2);min-width:72px;flex-shrink:0}
.btn-p{width:100%;padding:13px;background:var(--accent);color:#fff;border-radius:var(--r-sm);font-size:14px;font-weight:500;margin-top:4px;font-family:var(--font)}
.btn-p:active{opacity:.85}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:6px 12px;border-radius:20px;border:.5px solid var(--border2);color:var(--t2);background:var(--surface2);cursor:pointer;transition:all .15s}
.chip.on{background:var(--accent-l);color:var(--accent);border-color:var(--accent);font-weight:500}
.chip i{font-size:13px}
.cat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.cat{border:.5px solid var(--border2);border-radius:var(--r-sm);padding:10px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:all .15s;font-size:13px;color:var(--t1)}
.cat.on{border:2px solid var(--accent);background:var(--accent-l);color:var(--accent);font-weight:500}
.cat.on-inc{border:2px solid #1D9E75;background:#E1F5EE;color:#085041;font-weight:500}
.cat i{font-size:17px}
.sg{border:.5px solid var(--border);border-radius:var(--r-md);overflow:hidden;margin-bottom:8px;background:var(--surface)}
.sr{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:.5px solid var(--border);cursor:pointer}
.sr:last-child{border-bottom:none}
.sr:active{background:var(--surface2)}
.srl{display:flex;align-items:center;gap:12px}
.si{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.sl{font-size:14px}
.ss{font-size:11px;color:var(--t3);margin-top:1px}
.gt{font-size:11px;font-weight:500;color:var(--t3);letter-spacing:.05em;text-transform:uppercase;margin:18px 0 6px}
.gt:first-child{margin-top:0}
.iz{border:1.5px dashed var(--border2);border-radius:var(--r-md);padding:24px 16px;text-align:center;cursor:pointer}
.iz i{font-size:28px;color:var(--t3);margin-bottom:6px;display:block}
.numpad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:12px}
.nk{background:var(--surface2);border-radius:var(--r-sm);padding:16px;font-size:20px;font-weight:500;text-align:center;cursor:pointer;border:.5px solid var(--border);color:var(--t1);font-family:var(--mono);user-select:none}
.nk:active{background:var(--border)}
.amt{text-align:center;padding:8px 0 14px}
.amt-big{font-size:38px;font-weight:500;font-family:var(--mono);letter-spacing:-1px}
.sc{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.sp{font-size:12px;padding:4px 12px;border-radius:20px;background:var(--surface2);color:var(--t2);cursor:pointer;border:.5px solid var(--border);font-family:var(--mono)}
.sp:active{background:var(--border)}
.div{height:.5px;background:var(--border);margin:12px 0}
.in{color:var(--income)}.out{color:var(--expense)}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState,useEffect,useMemo,useCallback,useRef,createElement:h,Fragment}=React;
const {PieChart,Pie,Cell,Tooltip,LineChart,Line,ResponsiveContainer,ReferenceLine,XAxis}=Recharts;

// ─── Config ──────────────────────────────────────────────────────────────────
// デプロイ後にあなたのWorker URLに変更してください
const API_BASE = 'https://kakeibo-api.YOUR_SUBDOMAIN.workers.dev';
// Googleログイン用クライアントID（後ほど設定）
const GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID';

// ─── API クライアント ─────────────────────────────────────────────────────────
const api = {
  token: null,

  init() {
    this.token = localStorage.getItem('kakeibo_token');
  },

  setToken(t) {
    this.token = t;
    if (t) localStorage.setItem('kakeibo_token', t);
    else localStorage.removeItem('kakeibo_token');
  },

  async req(path, options = {}) {
    const res = await fetch(API_BASE + path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        ...(this.token ? { Authorization: `Bearer ${this.token}` } : {}),
        ...options.headers,
      },
    });
    if (res.status === 401) { api.setToken(null); return null; }
    if (!res.ok) return null;
    return res.json();
  },

  get: (path) => api.req(path),
  post: (path, body) => api.req(path, { method: 'POST', body: JSON.stringify(body) }),
  put: (path, body) => api.req(path, { method: 'PUT', body: JSON.stringify(body) }),
  del: (path) => api.req(path, { method: 'DELETE' }),

  async loginWithGoogle(idToken) {
    const data = await api.post('/auth/google', { idToken });
    if (data?.token) { api.setToken(data.token); return data; }
    return null;
  },

  async getAll() { return api.get('/all'); },
  async syncTxs(since) { return api.get(`/transactions/sync?since=${encodeURIComponent(since)}`); },
  async importTxs(transactions) { return api.post('/transactions/import', { transactions }); },
  async addTx(tx) { return api.post('/transactions', tx); },
  async delTx(id) { return api.del(`/transactions/${id}`); },
  async updateGoals(goals) { return api.put('/goals', goals); },
  async getAccounts() { return api.get('/accounts'); },
};
api.init();

// ─── Store (localStorage + Cloudflare sync) ──────────────────────────────────
const STORE_KEY='kakeibo_v1';
function loadState(){try{const s=localStorage.getItem(STORE_KEY);return s?JSON.parse(s):null}catch{return null}}
function saveState(s){try{localStorage.setItem(STORE_KEY,JSON.stringify(s))}catch{}}

const DEFAULT_STATE={
  transactions:[],
  lastImport:null,
  goals:{
    asset:{amount:6000000,targetDate:'2027-08',calcMonths:6},
    expense:{monthlyLimit:200000,yearlyLimit:2400000},
    income:{monthlyTarget:null,yearlyTarget:null}
  },
  accounts:[
    {id:'1',name:'三菱UFJ',type:'bank',icon:'ti-building-bank',color:'#EAF3DE',iconColor:'#27500A'},
    {id:'2',name:'SBI証券',type:'investment',icon:'ti-trending-up',color:'#EEEDFE',iconColor:'#3C3489'},
    {id:'3',name:'楽天カード',type:'credit',icon:'ti-credit-card',color:'#FAEEDA',iconColor:'#633806'},
  ]
};

const EXPENSE_CATS=[
  {id:'food',label:'食費',icon:'ti-tools-kitchen-2',color:'#FAECE7',ic:'#712B13'},
  {id:'dining',label:'外食',icon:'ti-building-store',color:'#FAEEDA',ic:'#633806'},
  {id:'convenience',label:'コンビニ',icon:'ti-shopping-bag',color:'#E1F5EE',ic:'#085041'},
  {id:'daily',label:'日用品',icon:'ti-shopping-cart',color:'#EEEDFE',ic:'#3C3489'},
  {id:'kids',label:'子供',icon:'ti-baby-carriage',color:'#E6F1FB',ic:'#0C447C'},
  {id:'dog',label:'犬',icon:'ti-paw',color:'#EAF3DE',ic:'#27500A'},
  {id:'fixed',label:'固定費',icon:'ti-receipt',color:'#F1EFE8',ic:'#444441'},
  {id:'other_exp',label:'その他',icon:'ti-dots',color:'#F1EFE8',ic:'#888780'},
];
const INCOME_CATS=[
  {id:'salary',label:'給料',icon:'ti-briefcase',color:'#EAF3DE',ic:'#27500A'},
  {id:'bonus',label:'ボーナス',icon:'ti-gift',color:'#FAEEDA',ic:'#633806'},
  {id:'interest',label:'利子所得',icon:'ti-percentage',color:'#E6F1FB',ic:'#0C447C'},
  {id:'other_inc',label:'その他',icon:'ti-dots',color:'#F1EFE8',ic:'#888780'},
];
const EXP_COLORS=['#E24B4A','#EF9F27','#378ADD','#534AB7','#1D9E75','#D4537E','#888780','#639922'];
const INC_COLORS=['#1D9E75','#639922','#085041','#3B6D11'];

// ─── Utilities ────────────────────────────────────────────────────────────
const fmt=n=>`¥${Math.round(n).toLocaleString('ja-JP')}`;
const fmtS=n=>{const a=Math.abs(n);if(a>=1e6)return`¥${(n/1e6).toFixed(1)}M`;if(a>=10000)return`¥${Math.round(n/10000)}万`;return fmt(n)};
const toISO=d=>d.toISOString().slice(0,10);
const parseDate=s=>{const[y,m,d]=(s||'').split('-').map(Number);return new Date(y,m-1,d)};
const startOfMonth=d=>new Date(d.getFullYear(),d.getMonth(),1);
const endOfMonth=d=>new Date(d.getFullYear(),d.getMonth()+1,0,23,59,59);
const subMonths=(d,n)=>new Date(d.getFullYear(),d.getMonth()-n,1);
const formatYM=d=>`${d.getFullYear()}年${d.getMonth()+1}月`;
const FISCAL_START=3; // April index
const getFY=(d=new Date())=>d.getMonth()>=FISCAL_START?d.getFullYear():d.getFullYear()-1;
const getFYRange=y=>({start:new Date(y,FISCAL_START,1),end:new Date(y+1,FISCAL_START-1,31,23,59,59)});
const daysSince=s=>{if(!s)return 999;return Math.floor((Date.now()-new Date(s).getTime())/86400000)};
const isMonday=()=>new Date().getDay()===1;

function getTxInRange(txs,start,end){return txs.filter(t=>{const d=parseDate(t.date);return d>=start&&d<=end})}
function getAssetHistory(txs){
  const now=new Date();
  return Array.from({length:12},(_,i)=>{
    const d=new Date(now.getFullYear(),now.getMonth()-11+i,1);
    const end=endOfMonth(d);
    const bal=txs.filter(t=>parseDate(t.date)<=end).reduce((s,t)=>t.type==='income'?s+t.amount:s-t.amount,0);
    return{label:`${d.getMonth()+1}月`,balance:bal,date:d};
  });
}
function getMonthlyAvg(txs,months){
  const hist=getAssetHistory(txs);
  if(hist.length<2)return 0;
  const rec=hist.slice(-months);
  const diffs=[];
  for(let i=1;i<rec.length;i++)diffs.push(rec[i].balance-rec[i-1].balance);
  return diffs.reduce((s,d)=>s+d,0)/diffs.length;
}
function getPrediction(txs,goal){
  const hist=getAssetHistory(txs);
  const current=hist[hist.length-1]?.balance??0;
  const avg=getMonthlyAvg(txs,goal.calcMonths);
  if(avg<=0)return null;
  const months=Math.ceil((goal.amount-current)/avg);
  const date=new Date();date.setMonth(date.getMonth()+months);
  return{date,months,avg,current};
}
function getCatBreakdown(txs,type,start,end){
  const filtered=getTxInRange(txs,start,end).filter(t=>t.type===type);
  const cats=type==='expense'?EXPENSE_CATS:INCOME_CATS;
  const map={};
  filtered.forEach(t=>{map[t.category]=(map[t.category]||0)+t.amount});
  const total=Object.values(map).reduce((s,v)=>s+v,0);
  return cats.map(c=>({...c,amount:map[c.id]||0,pct:total>0?Math.round((map[c.id]||0)/total*100):0}))
    .filter(c=>c.amount>0).sort((a,b)=>b.amount-a.amount);
}

// ─── CSV Parser ───────────────────────────────────────────────────────────
const CATMAP={'食費':'food','外食':'dining','コンビニ':'convenience','日用品':'daily','子供':'kids','犬':'dog','固定費':'fixed','家賃':'fixed','給料':'salary','給与':'salary','ボーナス':'bonus','賞与':'bonus','利子':'interest','配当':'interest'};
function guesscat(label,type){for(const[k,v]of Object.entries(CATMAP))if(label.includes(k))return v;return type==='income'?'other_inc':'other_exp'}
function normalDate(s){const m=(s||'').match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:'';}
function parseMC(text){
  const r=Papa.parse(text,{header:true,skipEmptyLines:true});
  return r.data.map(row=>{
    const raw=parseFloat((row['金額']||row['amount']||'0').replace(/[,¥]/g,''));
    const amt=Math.abs(raw);const type=raw>=0?'income':'expense';
    return{id:crypto.randomUUID(),date:normalDate(row['日付']||row['date']||''),amount:amt,type,category:guesscat(row['カテゴリ']||row['category']||'',type),description:row['内容']||row['description']||row['メモ']||'',account:row['口座']||row['account']||'',source:'csv',createdAt:new Date().toISOString()};
  }).filter(t=>t.date&&t.amount>0);
}
function parsePayPay(text){
  const r=Papa.parse(text,{header:true,skipEmptyLines:true});
  return r.data.map(row=>{
    const amt=parseFloat((row['決済金額']||row['利用金額']||row['amount']||'0').replace(/[,¥]/g,''));
    return{id:crypto.randomUUID(),date:normalDate(row['決済日']||row['利用日']||row['date']||''),amount:Math.abs(amt),type:'expense',category:'other_exp',description:row['サービス名']||row['加盟店名']||'PayPay',account:'PayPay',source:'paypay',createdAt:new Date().toISOString()};
  }).filter(t=>t.date&&t.amount>0);
}

// ─── Main App ─────────────────────────────────────────────────────────────
function App(){
  const[state,_setState]=useState(()=>{const s=loadState();return s||DEFAULT_STATE});
  const setState=useCallback(fn=>{_setState(prev=>{const next=typeof fn==='function'?fn(prev):fn;saveState(next);return next});},[]);

  const[tab,setTab]=useState('home');
  const[authUser,setAuthUser]=useState(()=>{const t=localStorage.getItem('kakeibo_token');return t?{loggedIn:true}:null;});
  const[syncing,setSyncing]=useState(false);
  const[syncMsg,setSyncMsg]=useState('');
  const[useCloud,setUseCloud]=useState(()=>!!localStorage.getItem('kakeibo_token'));

  const syncFromCloud=useCallback(async()=>{
    if(!api.token)return;
    setSyncing(true);setSyncMsg('同期中...');
    try{
      const data=await api.getAll();
      if(data){
        setState(s=>({...s,transactions:data.transactions,goals:{...s.goals,...data.goals},accounts:data.accounts||s.accounts}));
        setSyncMsg('同期完了');setTimeout(()=>setSyncMsg(''),2000);
      }
    }catch(e){setSyncMsg('同期失敗');}
    setSyncing(false);
  },[]);

  useEffect(()=>{if(useCloud&&api.token)syncFromCloud();},[useCloud]);

  const{transactions:txs,goals,accounts,lastImport}=state;

  // ── Computed ────
  const now=new Date();
  const fyear=getFY();
  const{start:fyStart,end:fyEnd}=getFYRange(fyear);
  const fyTxs=getTxInRange(txs,fyStart,fyEnd);
  const fyIncome=fyTxs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const fyExpense=fyTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const mStart=startOfMonth(now);const mEnd=endOfMonth(now);
  const mTxs=getTxInRange(txs,mStart,mEnd);
  const mExpense=mTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const assetHist=useMemo(()=>getAssetHistory(txs),[txs]);
  const currentAsset=assetHist[assetHist.length-1]?.balance??0;
  const prevAsset=assetHist[assetHist.length-2]?.balance??currentAsset;
  const assetDiff=currentAsset-prevAsset;

    if(useCloud&&api.token)await api.addTx(newTx);
  },[useCloud]);

  const importTxs=useCallback(async newTxs=>{
    setState(s=>{
      const ex=new Set(s.transactions.map(t=>`${t.date}_${t.amount}_${t.description}`));
      const filtered=newTxs.filter(t=>!ex.has(`${t.date}_${t.amount}_${t.description}`));
      return{...s,transactions:[...s.transactions,...filtered],lastImport:new Date().toISOString()};
    });
    if(useCloud&&api.token)await api.importTxs(newTxs);
  },[useCloud]);

    setState(s=>({...s,goals:{...s.goals,[type]:{...s.goals[type],...g}}}));

      const prevEnd=endOfMonth(subMonths(now,1));
      const prev=atxs.filter(t=>parseDate(t.date)<=prevEnd).reduce((s,t)=>t.type==='income'?s+t.amount:s-t.amount,0);

    const dispChart=useMemo(()=>{
      if(selAcc==='all')return chartData;

        const d=new Date(now.getFullYear(),now.getMonth()-11+i,1);

      h('div',{className:'chip-row'},
        h('div',{className:`chip ${selAcc==='all'?'on':''}`,onClick:()=>setSelAcc('all')},h('i',{className:'ti ti-layout-grid'}),'全体'),
        ...accounts.map(acc=>h('div',{key:acc.id,className:`chip ${selAcc===acc.id?'on':''}`,onClick:()=>setSelAcc(acc.id)},h('i',{className:`ti ${acc.icon}`}),acc.name))
      ),
      h('div',{className:'card'},
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:4}},
          h('span',{style:{fontSize:13,fontWeight:500}},dispName),
          h('span',{style:{fontSize:22,fontWeight:500}},fmt(dispBal))
        ),
        h('div',{style:{display:'grid',gridTemplateColumns:'repeat(2,minmax(0,1fr))',gap:6,marginBottom:12}},
          ...stats.map(([lbl,val,col])=>h('div',{key:lbl,style:{background:'var(--surface2)',borderRadius:6,padding:'6px 10px',border:'.5px solid var(--border)'}},
            h('div',{style:{fontSize:11,color:'var(--t3)'}},lbl),
            h('div',{style:{fontSize:13,fontWeight:500,color:col?(val>=0?'var(--income)':'var(--expense)'):'var(--t2)'}},`${col&&val>=0?'+':''}${fmtS(val)}`)
          ))
        ),
        h('div',{style:{height:90}},
          h(ResponsiveContainer,{width:'100%',height:'100%'},
            h(LineChart,{data:dispChart,margin:{left:0,right:0,top:4,bottom:4}},
              h(XAxis,{dataKey:'name',tick:{fontSize:9,fill:'var(--t3)'},axisLine:false,tickLine:false}),
              h(Tooltip,{content:h(CTip)}),
              selAcc==='all'&&h(ReferenceLine,{y:goals.asset.amount,stroke:'#534AB7',strokeDasharray:'4 3',strokeOpacity:.4}),
              h(Line,{type:'monotone',dataKey:'value',stroke:'#534AB7',strokeWidth:2,dot:false,activeDot:{r:4,fill:'#534AB7'}})
            )
          )
        )
      ),
      h('div',{className:'s-head'},'口座別残高'),
      h('div',{className:'card',style:{padding:'4px 16px'}},
        ...accBals.map(acc=>h('div',{key:acc.id,className:'row',style:{cursor:'pointer'},onClick:()=>setSelAcc(acc.id)},

            h('div',{className:'icon',style:{background:acc.color}},h('i',{className:`ti ${acc.icon}`,style:{color:acc.iconColor}})),

          ),

          )
        ))

    );

    const[memo,setMemo]=useState('');

  // IMPORT
  const PageImport=()=>{
    const[csvType,setCsvType]=useState('mc');
    const[preview,setPreview]=useState(null);
    const[done,setDone]=useState(false);
    const[err,setErr]=useState('');
    const ref=useRef();
    const handleFile=e=>{
      const f=e.target.files?.[0];if(!f)return;
      setErr('');setDone(false);
      const r=new FileReader();
      r.onload=ev=>{
        try{
          const parsed=csvType==='paypay'?parsePayPay(ev.target.result):parseMC(ev.target.result);
          if(!parsed.length){setErr('データが見つかりませんでした');return}
          setPreview(parsed);
        }catch{setErr('読み込みに失敗しました')}
      };
      r.readAsText(f,'UTF-8');
    };
    const doImport=()=>{if(!preview)return;importTxs(preview);setDone(true);setPreview(null);if(ref.current)ref.current.value='';};
    const inc=preview?.filter(t=>t.type==='income').length??0;

    return h('div',{className:'p'},
      h('div',{className:'s-head'},'取込み形式'),
      h('div',{className:'toggle'},

      ),
      h('div',{className:'fr'},h('label',{className:'fl'},'目標金額'),h('input',{className:'fi',type:'number',value:ag.amount,onChange:e=>setAg({...ag,amount:parseInt(e.target.value)||0})})),
      h('div',{className:'fr'},h('label',{className:'fl'},'目標期日'),h('input',{className:'fi',type:'month',value:ag.targetDate,onChange:e=>setAg({...ag,targetDate:e.target.value})})),
      h('div',{className:'fr'},h('label',{className:'fl'},'計算基準'),
        h('select',{className:'fi',value:ag.calcMonths,onChange:e=>setAg({...ag,calcMonths:Number(e.target.value)})},
          h('option',{value:3},'直近3ヶ月の平均'),h('option',{value:6},'直近6ヶ月の平均'),h('option',{value:12},'直近12ヶ月の平均')
        )
      ),
      h('div',{className:'predict',style:{marginTop:8}},
        h('div',{className:'predict-lbl'},'目標金額'),
        h('div',{className:'predict-val'},fmt(ag.amount)),
        h('div',{className:'predict-sub'},'達成予測はホーム・資産タブで確認できます')
      )
    );

    if(screen==='expense')return h('div',{className:'p'},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}},
        h('button',{className:'nav-btn',onClick:()=>setScr('top')},h('i',{className:'ti ti-arrow-left'})),
        h('span',{style:{fontWeight:500}},'家計目標'),
        h('button',{className:'nav-btn-text',onClick:()=>{setGoals('expense',eg);setScr('top')}},'保存')
      ),
      h('div',{className:'gt',style:{marginTop:0}},'支出の目標'),
      h('div',{className:'fr'},h('label',{className:'fl'},'月の上限'),h('input',{className:'fi',type:'number',value:eg.monthlyLimit,onChange:e=>setEg({...eg,monthlyLimit:parseInt(e.target.value)||0,yearlyLimit:(parseInt(e.target.value)||0)*12})})),
      h('div',{className:'fr'},h('label',{className:'fl'},'年度上限'),h('input',{className:'fi',type:'number',value:eg.yearlyLimit,onChange:e=>setEg({...eg,yearlyLimit:parseInt(e.target.value)||0})})),
      h('div',{style:{fontSize:11,color:'var(--t3)',marginBottom:12,paddingLeft:82}},`月額×12 = ${fmt(eg.monthlyLimit*12)}`),
      h('div',{className:'div'}),
      h('div',{className:'predict',style:{marginTop:4}},
        h('div',{className:'predict-lbl'},'現在のペース（年度）'),
        h('div',{className:'predict-val'},expSurplus>=0?`${fmt(expSurplus)} 余る見込み`:`${fmt(-expSurplus)} 超過見込み`),
        h('div',{className:'predict-sub'},`月平均 ${fmt(Math.round(fyExpense/monthsElapsed))}`)
      )
    );

    const exportCSV=()=>{
      const csv=['日付,種別,金額,カテゴリ,メモ,口座'].concat(txs.map(t=>`${t.date},${t.type},${t.amount},${t.category},"${t.description}",${t.account}`)).join('\n');
      const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=`kakeibo_${toISO(new Date())}.csv`;a.click();URL.revokeObjectURL(url);
    };

    const SR=({icon,bg,ic,label,sub,onClick})=>h('div',{className:'sr',onClick},
      h('div',{className:'srl'},
        icon&&h('div',{className:'si',style:{background:bg}},h('i',{className:`ti ${icon}`,style:{color:ic}})),
        h('div',null,h('div',{className:'sl'},label),sub&&h('div',{className:'ss'},sub))
      ),
      h('i',{className:'ti ti-chevron-right',style:{fontSize:16,color:'var(--t3)'}})
    );

    return h('div',{className:'p'},
      h('div',{className:'gt',style:{marginTop:0}},'目標管理'),
      h('div',{className:'sg'},
        h(SR,{icon:'ti-target',bg:'#EEEDFE',ic:'#3C3489',label:'資産目標',sub:`${fmt(goals.asset.amount)}　${goals.asset.targetDate}`,onClick:()=>setScr('asset')}),
        h(SR,{icon:'ti-wallet',bg:'#EAF3DE',ic:'#27500A',label:'家計目標（支出上限）',sub:`${fmt(goals.expense.monthlyLimit)} / 月`,onClick:()=>setScr('expense')})
      ),
      h('div',{className:'gt'},'口座・データ'),
      h('div',{className:'sg'},
        h(SR,{icon:'ti-building-bank',bg:'#E6F1FB',ic:'#0C447C',label:'口座・資産の管理',sub:`${accounts.length}口座登録済み`,onClick:()=>{}}),
        h(SR,{icon:'ti-tags',bg:'#FAEEDA',ic:'#633806',label:'カテゴリの管理',sub:`収入${INCOME_CATS.length}件・支出${EXPENSE_CATS.length}件`,onClick:()=>{}})
      ),
      h('div',{className:'gt'},'データ管理'),
      h('div',{className:'sg'},
        h(SR,{icon:'ti-download',bg:'#E1F5EE',ic:'#085041',label:'データをエクスポート',sub:`${txs.length}件`,onClick:exportCSV})
      ),
      h('div',{style:{textAlign:'center',fontSize:12,color:'var(--t3)',marginTop:24}},'家計簿 v1.0.0')
    );
  };

  // ─── Tab rendering ──────────────────────────────────────────────────────
  const pages={home:PageHome,assets:PageAssets,household:PageHousehold,input:PageInput,import:PageImport,settings:PageSettings};
  const titles={home:'家計簿',assets:'資産管理',household:'家計簿',input:'入力',import:'データ取込み',settings:'設定'};
  const CurrentPage=pages[tab]||PageHome;
  const showTabs=tab!=='settings';

  const navRight=()=>{
    if(tab==='settings')return h('span',{style:{width:36}});
    if(['home','assets','household'].includes(tab))
      return h('div',{style:{display:'flex',alignItems:'center',gap:8}},
        syncMsg&&h('span',{style:{fontSize:11,color:'var(--t3)'}},(syncing?'⟳ ':'✓ ')+syncMsg),
        useCloud&&!syncing&&h('button',{className:'nav-btn',onClick:syncFromCloud},h('i',{className:'ti ti-refresh',style:{fontSize:18}})),
        h('button',{className:'nav-btn',onClick:()=>setTab('settings')},h('i',{className:`ti ${tab==='home'?'ti-settings':'ti-edit'}`}))
      );
    return h('span',{style:{width:36}});
  };
  const navLeft=()=>{
    if(tab==='settings')return h('button',{className:'nav-btn',onClick:()=>setTab('home')},h('i',{className:'ti ti-arrow-left'}));
    return h('span',{style:{width:36}});
  };

  const TABS=[
    {id:'home',icon:'ti-home',label:'ホーム'},
    {id:'assets',icon:'ti-chart-bar',label:'資産'},
    {id:'household',icon:'ti-wallet',label:'家計'},
    {id:'input',icon:'ti-plus',label:'入力'},
    {id:'import',icon:'ti-upload',label:'取込'},
  ];

  return h('div',{className:'shell'},
    h('div',{className:'nav'},navLeft(),h('span',{className:'nav-title'},titles[tab]),navRight()),
    h('div',{className:'scroll'},h(CurrentPage)),
    showTabs&&h('div',{className:'tabs'},
      ...TABS.map(t=>h('button',{key:t.id,className:`tab ${tab===t.id?'on':''}`,onClick:()=>setTab(t.id)},
        h('i',{className:`ti ${t.icon}`}),h('span',null,t.label)
      ))
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
